<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;color:#17233f;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;">
          <tr>
            <td align="center" style="padding:30px 32px 26px;border-bottom:1px solid #e4e7ec;">
              <p style="margin:0;color:#17233f;font-size:22px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;">{{ branding.name }}</p>
              {% if branding.tagline %}<p style="margin:7px 0 0;color:#56627d;font-size:11px;letter-spacing:2px;text-transform:uppercase;">{{ branding.tagline }}</p>{% endif %}
            </td>
          </tr>
          {% if featured_image_url %}
          <tr>
            <td><img data-email-editable="cover-image" src="{{ featured_image_url }}" alt="{{ headline }}" width="600" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none;"></td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:34px 32px 36px;">
              <p style="margin:0 0 12px;color:#1c5fc0;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;">{{ category }}</p>
              <h1 data-email-editable="headline" style="margin:0;color:#17233f;font-size:30px;line-height:1.3;font-weight:700;">{{ headline }}</h1>
              <p data-email-editable="summary" style="margin:18px 0 0;color:#56627d;font-size:16px;line-height:1.65;">{{ summary }}</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:25px;">
                <tr>
                  <td bgcolor="#173f78" style="border-radius:7px;">
                    <a href="{{ article_url }}" style="display:inline-block;padding:13px 19px;color:#ffffff;font-size:14px;font-weight:700;line-height:1;text-decoration:none;">Read Full Article</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 32px;background-color:#f8f9fb;border-top:1px solid #e4e7ec;">
              <p style="margin:0;color:#6b7280;font-size:12px;line-height:1.55;">{{ branding.footer_text }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
